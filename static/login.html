<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · findData</title><link rel="stylesheet" href="/static/styles.css"><style>body{display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}.login-card{width:100%;max-width:440px;background:white;border:1px solid #dce4e0;border-radius:14px;padding:32px;box-sizing:border-box}.login-card h1{font-size:28px;margin-top:28px}.login-card p{line-height:1.6;color:#526762}.login-card label{display:block;margin:18px 0 8px}.login-card input{width:100%;padding:12px;border:1px solid #b8cbc4;border-radius:6px;box-sizing:border-box;font:inherit}.login-card .primary{width:100%;margin:24px 0 12px}.login-card .brand{color:#193e3e}.login-card #login-error{color:#a33030}.login-card .text-button{padding:8px 0}</style></head><body><section class="login-card"><a class="brand" href="/">findData ↗</a><h1 id="auth-title">Welcome back</h1><p id="auth-description">Sign in to your statement workspace.</p><form id="login-form"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.\-]+" autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256"><p id="login-error" role="alert"></p><button class="primary" id="submit-auth">Sign in</button></form><button type="button" class="text-button" id="switch-auth">Create an account</button><p>You’ll stay signed in on this browser for 30 days, or until you log out.</p><p id="setup-note" hidden>The first account takes ownership of the existing statements and keywords on this installation.</p></section><script src="/static/login.js"></script></body></html>
